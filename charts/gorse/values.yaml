## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass
##

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""

## @section Common parameters
##

## @param kubeVersion Override Kubernetes version
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param secretAnnotations Annotations to add to secret
##
secretAnnotations: {}
## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: cluster.local

## @section Architecture parameters
##

## @param architecture Gorse deployment architecture. Allowed values: `standalone` or `distributed`
## - standalone: Deploy gorse-in-one (all-in-one) for development/testing
## - distributed: Deploy full Gorse cluster (master, worker, server) for production
##
architecture: distributed

## @section Gorse Configuration parameters
##
gorse:
  dashboard:
    ## @param gorse.dashboard.username Username for the dashboard.
    ##
    username: "gorse"
    ## @param gorse.dashboard.password Password for the dashboard.
    ##
    password: ""
    ## @param gorse.dashboard.authServer Token server for the dashboard.
    ##
    authServer: ""

  master:
    ssl:
      ## @section Master SSL
      ##
      ## @param gorse.master.ssl.mode Enable SSL for the gRPC communication.
      ##
      mode: false
      ## @param gorse.master.ssl.ca SSL certification authority for the gRPC communication.
      ##
      ca: ""
      ## @param gorse.master.ssl.cert SSL certification for the gRPC communication.
      ##
      cert: ""
      ## @param gorse.master.ssl.key SSL certification key for the gRPC communication.
      ##
      key: ""

  api:
    ## @param gorse.api.key The key to secure the API endpoint
    ##
    key: ""
    ## @param gorse.api.corsDomains List of allowed values for Http Origin
    ##
    corsDomains: []
    ## @param gorse.api.corsMethods List of http methods names. Checking is case-insensitive.
    ##
    corsMethods: []
    ## @param gorse.api.autoInsertUsers Insert new users while inserting feedback
    ##
    autoInsertUsers: true
    ## @param gorse.api.autoInsertItems Insert new items while inserting feedback.
    ##
    autoInsertItems: true
    ## @param gorse.api.returnSize Default number of returned items
    ##
    returnSize: 10
    ## @param gorse.api.serverCacheExpire Server-side cache expire time
    ##
    serverCacheExpire: "10s"

  recommend: ""
  ## @param gorse.recommend TOML string for recommend configuration
  ## Example:
  ## recommend: |
  ##   [recommend.data_source]
  ##   positive_feedbacks = ["star", "like"]
  ##   [recommend.cache]
  ##   size = 100
  ##   expire = "72h"

  openai:
    ## @param gorse.openai.baseUrl Base URL of OpenAI API / Ollama
    ##
    baseUrl: "http://localhost:11434/v1"
    ## @param gorse.openai.authToken API key of OpenAI API
    ##
    authToken: ""
    ## @param gorse.openai.chatCompletionModel Name of chat completion model
    ##
    chatCompletionModel: "qwen2.5"
    ## @param gorse.openai.chatCompletionRpm Maximum requests per minute for chat completion
    ##
    chatCompletionRpm: 15000
    ## @param gorse.openai.chatCompletionTpm Maximum tokens per minute for chat completion
    ##
    chatCompletionTpm: 1200000
    ## @param gorse.openai.embeddingModel Name of embedding model
    ##
    embeddingModel: "mxbai-embed-large"
    ## @param gorse.openai.embeddingDimensions Dimensions of embedding vectors
    ##
    embeddingDimensions: 1024
    ## @param gorse.openai.embeddingRpm Maximum requests per minute for embedding
    ##
    embeddingRpm: 1800
    ## @param gorse.openai.embeddingTpm Maximum tokens per minute for embedding
    ##
    embeddingTpm: 1200000
    ## @param gorse.openai.logFile Log file for OpenAI API
    ##
    logFile: "openai.log"

  ## @section Tracing configuration
  ##
  tracing:
    ## @param gorse.tracing.enable Enable tracing for REST APIs
    ##
    enable: false
    ## @param gorse.tracing.exporter Tracing exporter type (zipkin|otlp|otlphttp)
    ##
    exporter: "otlphttp"
    ## @param gorse.tracing.collectorEndpoint Tracing collector endpoint
    ##
    collectorEndpoint: "http://localhost:4318/v1/traces"
    ## @param gorse.tracing.sampler Tracing sampler type (always|never|ratio)
    ##
    sampler: "always"
    ## @param gorse.tracing.ratio Ratio used when sampler is set to ratio
    ##
    ratio: 1

  ## @section OIDC configuration
  ##
  oidc:
    ## @param gorse.oidc.enable Enable OpenID Connect authentication
    ##
    enable: false
    ## @param gorse.oidc.issuer OAuth provider issuer
    ##
    issuer: ""
    ## @param gorse.oidc.clientId OAuth application client ID
    ##
    clientId: ""
    ## @param gorse.oidc.clientSecret OAuth application client secret
    ##
    clientSecret: ""
    ## @param gorse.oidc.redirectUrl OAuth redirect/callback URL
    ##
    redirectUrl: ""

## @section Gorse master node parameters

## @section Gorse standalone (gorse-in-one) parameters
## Only used when architecture is set to `standalone`
##
standalone:
  ## Gorse-in-one image version
  ## ref: https://hub.docker.com/r/zhenghaoz/gorse-in-one
  ## @param standalone.image.registry Gorse-in-one image registry
  ## @param standalone.image.repository Gorse-in-one image repository
  ## @param standalone.image.tag Gorse-in-one image tag (immutable tags are recommended)
  ## @param standalone.image.digest Gorse-in-one image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  ## @param standalone.image.pullPolicy Gorse-in-one image pull policy
  ## @param standalone.image.pullSecrets Specify docker-registry secret names as an array
  ##
  image:
    registry: docker.io
    repository: zhenghaoz/gorse-in-one
    tag: nightly
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  ## @param standalone.kind Use either Deployment or StatefulSet (default)
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
  ##
  kind: StatefulSet

  ## @param standalone.replicaCount Number of gorse-in-one replicas (should be 1 for standalone)
  ##
  replicaCount: 1

  ## Persistence parameters
  ## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
  ##
  persistence:
    ## @param standalone.persistence.enabled Enable persistence using Persistent Volume Claims
    ##
    enabled: true
    ## @param standalone.persistence.medium Provide a medium for `emptyDir` volumes.
    ##
    medium: ""
    ## @param standalone.persistence.sizeLimit Set this to enable a size limit for `emptyDir` volumes.
    ##
    sizeLimit: ""
    ## @param standalone.persistence.path The path the volume will be mounted at
    ##
    path: /var/lib/gorse
    ## @param standalone.persistence.subPath The subdirectory of the volume to mount
    ##
    subPath: ""
    ## @param standalone.persistence.storageClass Persistent Volume storage class
    ##
    storageClass: ""
    ## @param standalone.persistence.accessModes Persistent Volume access modes
    ##
    accessModes:
      - ReadWriteOnce
    ## @param standalone.persistence.size Persistent Volume size
    ##
    size: 1Gi

  ## Gorse-in-one service parameters
  ##
  service:
    ## @param standalone.service.type Kubernetes Service type
    ##
    type: ClusterIP
    ## @param standalone.service.ports.http Gorse-in-one HTTP service port
    ##
    ports:
      http: 8087
    ## @param standalone.service.nodePorts.http HTTP node port (only used when service.type is NodePort or LoadBalancer)
    ##
    nodePorts:
      http: ""
    ## @param standalone.service.clusterIP Gorse-in-one service Cluster IP
    ## e.g.:
    ## clusterIP: None
    ##
    clusterIP: ""
    ## @param standalone.service.loadBalancerIP Gorse-in-one service Load Balancer IP
    ## ref: https://kubernetes.io/docs/user-guide/services/#type-loadbalancer
    ##
    loadBalancerIP: ""
    ## @param standalone.service.loadBalancerSourceRanges Gorse-in-one service Load Balancer sources
    ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    ## e.g:
    ## loadBalancerSourceRanges:
    ##   - 10.10.10.0/24
    ##
    loadBalancerSourceRanges: []
    ## @param standalone.service.externalTrafficPolicy Gorse-in-one service external traffic policy
    ## ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    externalTrafficPolicy: Cluster
    ## @param standalone.service.annotations Additional custom annotations for Gorse-in-one service
    ##
    annotations: {}

  ## Gorse-in-one resource requests and limits
  ## ref: https://kubernetes.io/docs/user-guide/compute-resources/
  ## @param standalone.resources.limits The resources limits for the gorse-in-one containers
  ## @param standalone.resources.requests The requested resources for the gorse-in-one containers
  ##
  resources:
    limits: {}
    requests: {}

  ## Configure extra options for gorse-in-one containers' liveness and readiness probes
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
  ## @param standalone.livenessProbe.enabled Enable livenessProbe on gorse-in-one nodes
  ## @param standalone.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param standalone.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param standalone.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param standalone.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param standalone.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  ## @param standalone.readinessProbe.enabled Enable readinessProbe on gorse-in-one nodes
  ## @param standalone.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param standalone.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param standalone.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param standalone.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param standalone.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  ## @param standalone.podAffinityPreset Pod affinity preset. Ignored if `standalone.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAffinityPreset: ""
  ## @param standalone.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `standalone.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAntiAffinityPreset: soft
  ## Node standalone.affinity preset
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
  ##
  nodeAffinityPreset:
    ## @param standalone.nodeAffinityPreset.type Node affinity preset type. Ignored if `standalone.affinity` is set. Allowed values: `soft` or `hard`
    ##
    type: ""
    ## @param standalone.nodeAffinityPreset.key Node label key to match. Ignored if `standalone.affinity` is set.
    ##
    key: ""
    ## @param standalone.nodeAffinityPreset.values Node label values to match. Ignored if `standalone.affinity` is set.
    ##
    values: []
  ## @param standalone.affinity Affinity for gorse-in-one pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ## NOTE: `standalone.podAffinityPreset`, `standalone.podAntiAffinityPreset`, and `standalone.nodeAffinityPreset` will be ignored when it's set
  ##
  affinity: {}
  ## @param standalone.nodeSelector Node labels for gorse-in-one pods assignment
  ## ref: https://kubernetes.io/docs/user-guide/node-selection/
  ##
  nodeSelector: {}
  ## @param standalone.tolerations Tolerations for gorse-in-one pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []
  ## @param standalone.podLabels Extra labels for gorse-in-one pods
  ##
  podLabels: {}
  ## @param standalone.podAnnotations Annotations for gorse-in-one pods
  ##
  podAnnotations: {}
  ## @param standalone.priorityClassName gorse-in-one pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param standalone.schedulerName Name of the k8s scheduler (other than default)
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  schedulerName: ""
  ## @param standalone.terminationGracePeriodSeconds Seconds Redmine pod needs to terminate gracefully
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  ##
  terminationGracePeriodSeconds: ""
  ## @param standalone.topologySpreadConstraints Topology Spread Constraints for pod assignment
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
  ## The value is evaluated as a template
  ##
  topologySpreadConstraints: []
  ## @param standalone.podSecurityContextEnabled Enabled gorse-in-one pods' Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  ##
  podSecurityContextEnabled: true
  ## @param standalone.podSecurityContext.fsGroup Set gorse-in-one pod's Security Context fsGroup
  ##
  podSecurityContext:
    fsGroup: 1001
  ## @param standalone.containerSecurityContext.enabled Enabled gorse-in-one containers' Security Context
  ## @param standalone.containerSecurityContext.runAsUser Set gorse-in-one containers' Security Context runAsUser
  ## @param standalone.containerSecurityContext.runAsNonRoot Set gorse-in-one containers' Security Context runAsNonRoot
  ## @param standalone.containerSecurityContext.readOnlyRootFilesystem Set gorse-in-one containers' Security Context readOnlyRootFilesystem
  ##
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: false

  ## @param standalone.command Override default container command (useful when using custom images)
  ##
  command: []
  ## @param standalone.args Override default container args (useful when using custom images)
  ##
  args: []
  ## @param standalone.hostAliases gorse-in-one pods host aliases
  ## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
  ##
  hostAliases: []
  ## @param standalone.extraEnvVars Array with extra environment variables to add to gorse-in-one nodes
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##
  extraEnvVars: []
  ## @param standalone.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for gorse-in-one nodes
  ##
  extraEnvVarsCM: ""
  ## @param standalone.extraEnvVarsSecret Name of existing Secret containing extra env vars for gorse-in-one nodes
  ##
  extraEnvVarsSecret: ""
  ## @param standalone.extraVolumes Optionally specify extra list of additional volumes for the gorse-in-one pod(s)
  ##
  extraVolumes: []
  ## @param standalone.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the gorse-in-one container(s)
  ##
  extraVolumeMounts: []
  ## @param standalone.sidecars Add additional sidecar containers to the gorse-in-one pod(s)
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param standalone.initContainers Add additional init containers to the gorse-in-one pod(s)
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []

##
master:
  ## @param master.jobs Number of working jobs in the master node
  ##
  jobs: 1

  ## Gorse Master image version
  ## ref: https://hub.docker.com/r/zhenghaoz/gorse-master
  ## @param master.image.registry Gorse image registry
  ## @param master.image.repository Gorse Master image repository
  ## @param master.image.tag Gorse Master image tag (immutable tags are recommended)
  ## @param master.image.digest Gorse Master image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  ## @param master.image.pullPolicy Gorse Master image pull policy
  ## @param master.image.pullSecrets Specify docker-registry secret names as an array
  ##
  image:
    registry: docker.io
    repository: zhenghaoz/gorse-master
    tag: nightly
    digest: ""
    ## Specify an imagePullPolicy
    ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
    ##
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    ## Example:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: []

  ## @param master.kind Use either Deployment or StatefulSet (default)
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
  ##
  kind: StatefulSet

  ## Persistence parameters
  ## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
  ##
  persistence:
    ## @param master.persistence.enabled Enable persistence on Gorse master nodes using Persistent Volume Claims
    ##
    enabled: true
    ## @param master.persistence.medium Provide a medium for `emptyDir` volumes.
    ##
    medium: ""
    ## @param master.persistence.sizeLimit Set this to enable a size limit for `emptyDir` volumes.
    ##
    sizeLimit: ""
    ## @param master.persistence.path The path the volume will be mounted at on Gorse master containers
    ## NOTE: Useful when using different Gorse images
    ##
    path: /var/lib/gorse
    ## @param master.persistence.subPath The subdirectory of the volume to mount on Gorse master containers
    ## NOTE: Useful in dev environments
    ##
    subPath: ""
    ## @param master.persistence.subPathExpr Used to construct the subPath subdirectory of the volume to mount on Gorse master containers
    ##
    subPathExpr: ""
    ## @param master.persistence.storageClass Persistent Volume storage class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
    ##
    storageClass: ""
    ## @param master.persistence.accessModes Persistent Volume access modes
    ##
    accessModes:
      - ReadWriteOnce
    ## @param master.persistence.size Persistent Volume size
    ##
    size: 8Gi
    ## @param master.persistence.annotations Additional custom annotations for the PVC
    ##
    annotations: {}
    ## @param master.persistence.selector Additional labels to match for the PVC
    ## e.g:
    ## selector:
    ##   matchLabels:
    ##     app: my-app
    ##
    selector: {}
    ## @param master.persistence.dataSource Custom PVC data source
    ##
    dataSource: {}
    ## @param master.persistence.existingClaim Use a existing PVC which must be created manually before bound
    ## NOTE: requires master.persistence.enabled: true
    ##
    existingClaim: ""

  ## Gorse master service parameters
  ##
  service:
    ## @param master.service.type Gorse master service type
    ##
    type: ClusterIP
    ## @param master.service.ports.http HTTP port of the master node (dashboard)
    ## @param master.service.ports.grpc GRPC port of the master node
    ##
    ports:
      http: 80
      grpc: 8086
    ## @param master.service.nodePorts.http HTTP port of the master node (dashboard)
    ## @param master.service.nodePorts.grpc GRPC port of the master node
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
    ## NOTE: choose port between <30000-32767>
    ##
    nodePorts:
      http: ""
      grpc: ""
    ## @param master.service.externalTrafficPolicy Gorse master service external traffic policy
    ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    externalTrafficPolicy: Cluster
    ## @param master.service.extraPorts Extra ports to expose (normally used with the `sidecar` value)
    ##
    extraPorts: []
    ## @param master.service.internalTrafficPolicy Gorse master service internal traffic policy (requires Kubernetes v1.22 or greater to be usable)
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service-traffic-policy/
    ##
    internalTrafficPolicy: Cluster
    ## @param master.service.clusterIP Gorse master service Cluster IP
    ##
    clusterIP: ""
    ## @param master.service.loadBalancerIP Gorse master service Load Balancer IP
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#internal-load-balancer
    ##
    loadBalancerIP: ""
    ## @param master.service.loadBalancerSourceRanges Gorse master service Load Balancer sources
    ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    ## e.g.
    ## loadBalancerSourceRanges:
    ##   - 10.10.10.0/24
    ##
    loadBalancerSourceRanges: []
    ## @param master.service.annotations Additional custom annotations for Gorse master service
    ##
    annotations: {}
    ## @param master.service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
    ## If "ClientIP", consecutive client requests will be directed to the same Pod
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#virtual-ips-and-service-proxies
    ##
    sessionAffinity: None
    ## @param master.service.sessionAffinityConfig Additional settings for the sessionAffinity
    ## sessionAffinityConfig:
    ##   clientIP:
    ##     timeoutSeconds: 300
    ##
    sessionAffinityConfig: {}

  ## Configure the ingress resource that allows you to access the
  ## Gorse dashboard. Set up the URL
  ## ref: https://kubernetes.io/docs/user-guide/ingress/
  ##
  ingress:
    ## @param master.ingress.enabled Enable ingress controller resource
    ##
    enabled: false

    ## @param master.ingress.pathType Ingress Path type
    ##
    pathType: ImplementationSpecific
    ## @param master.ingress.apiVersion Override API Version (automatically detected if not set)
    ##
    apiVersion: ""
    ## @param master.ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
    ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
    ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
    ##
    ingressClassName: ""
    ## @param master.ingress.hostname Default host for the ingress resource
    ##
    hostname: gorse.local
    ## @param master.ingress.path The Path to Gorse. You may need to set this to '/*' in order to use this
    ## with ALB ingress controllers.
    ##
    path: /
    ## @param master.ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
    ## For a full list of possible ingress annotations, please see
    ## ref: https://github.com/kubernetes/ingress-nginx/blob/master/docs/user-guide/nginx-configuration/annotations.md
    ## Use this parameter to set the required annotations for cert-manager, see
    ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
    ##
    ## e.g:
    ## annotations:
    ##   kubernetes.io/ingress.class: nginx
    ##   cert-manager.io/cluster-issuer: cluster-issuer-name
    ##
    annotations: {}
    ## @param master.ingress.tls Enable TLS configuration for the hostname defined at ingress.hostname parameter
    ## TLS certificates will be retrieved from a TLS secret with name: {{- printf "%s-tls" .Values.ingress.hostname }}
    ## You can use the ingress.secrets parameter to create this TLS secret or relay on cert-manager to create it
    ##
    tls: false
    ## @param master.ingress.extraHosts The list of additional hostnames to be covered with this ingress record.
    ## Most likely the hostname above will be enough, but in the event more hosts are needed, this is an array
    ## extraHosts:
    ## - name: gorse.local
    ##   path: /
    extraHosts: []
    ## @param master.ingress.extraPaths Any additional arbitrary paths that may need to be added to the ingress under the main host.
    ## For example: The ALB ingress controller requires a special rule for handling SSL redirection.
    ## extraPaths:
    ## - path: /*
    ##   backend:
    ##     serviceName: ssl-redirect
    ##     servicePort: use-annotation
    extraPaths: []
    ## @param master.ingress.extraTls The tls configuration for additional hostnames to be covered with this ingress record.
    ## see: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
    ## extraTls:
    ## - hosts:
    ##     - gorse.local
    ##   secretName: gorse.local-tls
    extraTls: []
