{{- range $pipeline := .Values.gorse.pipelines }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" $ ) $pipeline.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  config.toml: |
    [database]

    {{- if $pipeline.externalDatabase.host }}
    # The database for caching (using pipeline-specific externalDatabase)
    cache_store = "mongodb://{{ $pipeline.externalDatabase.username }}:{{ $pipeline.externalDatabase.password }}@{{ $pipeline.externalDatabase.host }}:{{ $pipeline.externalDatabase.port }}/{{ $pipeline.externalDatabase.database }}"
    # The database for persist data (using pipeline-specific externalDatabase)
    data_store = "mongodb://{{ $pipeline.externalDatabase.username }}:{{ $pipeline.externalDatabase.password }}@{{ $pipeline.externalDatabase.host }}:{{ $pipeline.externalDatabase.port }}/{{ $pipeline.externalDatabase.database }}"
    {{- end }}
    {{- if not $pipeline.externalDatabase.host }}
    # The database for caching and persist data will be set via environment variables
    # cache_store and data_store are injected by GORSE_CACHE_STORE and GORSE_DATA_STORE
    {{- end }}

    # The naming prefix for tables (collections, keys) in databases.
    table_prefix = ""

    [master]

    # GRPC port of the master node. The default value is 8086.
    port = 8086

    # gRPC host of the master node. The default values is "0.0.0.0".
    host = "0.0.0.0"

    # HTTP port of the master node. The default values is 8088.
    http_port = 8088

    # HTTP host of the master node. The default values is "0.0.0.0".
    http_host = "0.0.0.0"

    # AllowedDomains is a list of allowed values for Http Origin.
    # The list may contain the special wildcard string ".*" ; all is allowed
    # If empty all are allowed.
    http_cors_domains = {{ include "gorse.toTOMLArray" (dict "List" $.Values.gorse.api.corsDomains) }}

    # AllowedMethods is either empty or has a list of http methods names. Checking is case-insensitive.
    http_cors_methods = {{ include "gorse.toTOMLArray" (dict "List" $.Values.gorse.api.corsMethods) }}

    # Number of working jobs in the master node. The default value is 1.
    n_jobs = 1

    # Meta information timeout. The default value is 10s.
    meta_timeout = "10s"

    # Username for the master node dashboard.
    dashboard_user_name = ""

    # Password for the master node dashboard.
    dashboard_password = ""

    # Secret key for admin APIs (SSL required).
    admin_api_key = ""

    [server]

    # Default number of returned items. The default value is 10.
    default_n = {{ $.Values.gorse.api.returnSize }}

    # Secret key for RESTful APIs (SSL required).
    api_key = ""

    # Clock error in the cluster. The default value is 5s.
    clock_error = "5s"

    # Insert new users while inserting feedback. The default value is true.
    auto_insert_user = {{ $.Values.gorse.api.autoInsertUsers }}

    # Insert new items while inserting feedback. The default value is true.
    auto_insert_item = {{ $.Values.gorse.api.autoInsertItems }}

    # Server-side cache expire time. The default value is 10s.
    cache_expire = {{ $.Values.gorse.api.serverCacheExpire | quote }}

    {{- if $pipeline.recommend }}
    {{ $pipeline.recommend | nindent 4 }}
    {{- end }}

    [tracing]

    # Enable tracing for REST APIs. The default value is false.
    enable_tracing = false

    # The type of tracing exporters should be one of "jaeger", "zipkin", "otlp" and "otlphttp". The default value is "jaeger".
    exporter = "jaeger"

    # The endpoint of tracing collector.
    collector_endpoint = "http://localhost:14268/api/traces"

    # The type of tracing sampler should be one of "always", "never" and "ratio". The default value is "always".
    sampler = "always"

    # The ratio of ratio based sampler. The default value is 1.
    ratio = 1
{{- end }}
